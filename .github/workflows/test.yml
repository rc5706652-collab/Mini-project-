name: Validate NoteWave
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: notewave-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check public/account-core.js
          node --check public/account.js
          node --check public/account-link.js
          node --check public/app.js
          node --check public/enterprise-ui.js
          node --check public/theme-core.js
          node --check public/theme.js
          node --check public/experience-core.js
          node --check public/notes.js
          node --check public/worker.js
          node --check public/whisper-config.js
          node --check public/study.js
          node --check public/learning-ui.js
          node --check public/semantic-worker.js
          node --check public/scene.js
          node --check public/robot.js
          node --check public/robot-chat.js
          node --check public/companion-core.js
          node --check public/speech-languages.js
          node --check public/translation-worker.js
          node --check public/translation-fastpath.js
          node --check public/translation-online.js
          node --check public/lecture-quiz-core.js
          node --check public/quiz-hub.js
          node --check public/pdf-lecture.js
          node --check public/loisel-companion.js
          node --check public/companion-worker.js
          node --check public/alchemy.js
          node --check public/alchemy-shapes.js
          node --check public/advanced-ui.js
          node --check public/knowledge.js
          node --check public/quiz.js
          node --check public/tutor.js
          node --check public/tutor-worker.js
          node --check public/memory.js
      - name: Run NLP and regression tests
        run: node --test tests/*.test.mjs
      - name: Verify static assets
        run: |
          test -s public/index.html
          test -s public/enterprise.css
          test -s public/enterprise-themes.css
          test -s public/reference-palette.css
          test -s public/theme.js
          test -s public/theme-core.js
          test -s public/robot-chat.css
          test -s public/robot.js
          test -s public/robot-chat.js
          test -s public/companion-core.js
          test -s public/companion-worker.js
          test -s public/speech-languages.js
          test -s public/translation-worker.js
          test -s public/translation-fastpath.js
          test -s public/translation-online.js
          test -s public/lecture-quiz-core.js
          test -s public/quiz-hub.js
          test -s public/pdf-lecture.js
          test -s public/loisel-companion.js
          test -s public/loisel-experience.css
          test -s public/loisel.css
          test -s public/loisel-portrait.jpg
          test -s public/enterprise-ui.js
          test -s public/experience-core.js
          test -s public/style.css
          test -s public/app.js
          test -s public/worker.js
          test -s public/alchemy.js
          test -s public/alchemy-shapes.js
          test -s public/advanced-ui.js
          test -s public/advanced-template.html
          test -s render.yaml
      - name: Install test package (browsers provided by container)
        run: npm install --no-save playwright@1.56.1
      - name: Local profile sign-in and sign-up browser matrix
        run: node tests/account-browser.mjs
      - name: Smoke test desktop and mobile
        run: node tests/browser-smoke.mjs
      - name: Cross-browser enterprise UI responsive matrix
        run: node tests/responsive-smoke.mjs
      - name: Loisel AI chatbot and voice browser verification
        run: node tests/companion-browser.mjs
      - name: Loisel multilingual translation and Quiz Studio browser smoke
        run: node tests/loisel-browser.mjs
      - name: Lecture PDF extraction and persistent Loisel companion browser matrix
        run: node tests/pdf-companion-browser.mjs
      - name: Enterprise dark/light/system theme browser matrix
        run: node tests/theme-browser.mjs
